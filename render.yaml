services:
  - type: web
    name: alibabafood-api
    env: docker
    rootDir: Backend/AlibabaFood.Api
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: alibabafood-db-v2
          property: connectionString
      - key: JwtSettings__SecretKey
        sync: false
      - key: PayOS__ClientId
        sync: false
      - key: PayOS__ApiKey
        sync: false
      - key: PayOS__ChecksumKey
        sync: false
      - key: AISettings__Gemini__ApiKey
        sync: false
      - key: AISettings__ElevenLabs__ApiKey
        sync: false
      - key: PayOS__ReturnUrl
        value: "https://alibabafood-frontend-jqay.onrender.com/payment/success"
      - key: PayOS__CancelUrl
        value: "https://alibabafood-frontend-jqay.onrender.com/payment/cancel"

  - type: web
    name: alibabafood-frontend
    env: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://alibabafood-api-jqay.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups

databases:
  - name: alibabafood-db-v2
    databaseName: alibabafood
    user: alibabafood_user
    plan: free
